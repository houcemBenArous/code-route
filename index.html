<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبار رخصة السياقة صنف ب</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">

      <!-- Start Screen -->
      <div class="start-screen" id="startScreen">
        <div class="big-icon">🚗</div>
        <h1>اختبار رخصة السياقة</h1>
        <p class="subtitle">صنف "ب" - تونس</p>
        <br />
        <p>📋 عدد الأسئلة الكلية: <strong id="totalQCount"></strong></p>
        <p>⏱️ وقت كل سؤال: <strong>30 ثانية</strong></p>
        <p>✅ نسبة النجاح المطلوبة: <strong>80%</strong></p>
        <p>🔀 الأسئلة تظهر بشكل عشوائي في كل مرة</p>
        <button class="start-btn" onclick="startQuiz()">ابدأ الاختبار</button>
      </div>

      <!-- Quiz Screen -->
      <div id="quizScreen" style="display: none">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="stats">
          <span>السؤال <span id="currentQ">1</span> / <span id="totalQ"></span></span>
          <span>✅ <span id="correctCount">0</span> صحيح &nbsp; ❌ <span id="wrongCount">0</span> خطأ</span>
        </div>
        <div class="timer-wrap">
          <div class="timer-circle" id="timerCircle">30</div>
          <span class="timer-label">ثانية متبقية</span>
        </div>
        <div class="question-num" id="categoryBadge"></div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
          السؤال التالي ◀
        </button>
        <button class="end-btn" id="endBtn" onclick="confirmEndQuiz()">
          🏁 إنهاء الاختبار
        </button>
      </div>

      <!-- Result Screen -->
      <div class="result-screen" id="resultScreen">
        <div class="result-icon" id="resultIcon"></div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-score" id="resultScore"></div>
        <div class="result-details" id="resultDetails"></div>
        <button class="restart-btn" onclick="restartQuiz()">إعادة الاختبار 🔄</button>
      </div>

    </div>

    <script src="js/questions.js"></script>
    <script src="js/quiz.js"></script>
  </body>
</html>
