<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Route — رخصة صنف ب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/style.css" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Code Route" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
  </head>
  <body>

    <!-- ══════════════ TOP NAV ══════════════ -->
    <nav class="top-nav">
      <div class="nav-brand">🚗 Code Route</div>
      <div class="nav-tabs">
        <button class="nav-tab active" id="tabQuiz" onclick="showSection('quiz')">
          📝 الاختبار
        </button>
        <button class="nav-tab" id="tabCourse" onclick="showSection('course')">
          📖 الدروس
        </button>
      </div>
      <button class="nav-install-btn" id="installBtn" style="display:none" onclick="installApp()">
        ⬇️ تثبيت
      </button>
    </nav>

    <!-- ══════════════ QUIZ SECTION ══════════════ -->
    <div class="section-wrap" id="sectionQuiz">
      <div class="container">

        <!-- Pack Selection -->
        <div id="packScreen">
          <div class="app-header">
            <div class="big-icon">📝</div>
            <h1>اختبار رخصة السياقة</h1>
            <p class="subtitle">صنف "ب" — تونس &nbsp;|&nbsp; اختر حزمة للبدء</p>
          </div>
          <div class="packs-grid" id="packsGrid"></div>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" style="display:none">
          <div class="quiz-header">
            <button class="back-btn" onclick="goBackToPacks()">&#8594; الحزم</button>
            <span class="pack-label" id="packLabel"></span>
          </div>
          <div class="progress-bar-wrap">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="stats">
            <span>السؤال <span id="currentQ">1</span> / <span id="totalQ"></span></span>
            <span>✅ <span id="correctCount">0</span> صحيح &nbsp;❌ <span id="wrongCount">0</span> خطأ</span>
          </div>
          <div class="timer-wrap">
            <div class="timer-circle" id="timerCircle">40</div>
            <span class="timer-label">ثانية متبقية</span>
          </div>
          <div class="question-num" id="categoryBadge"></div>
          <div class="question-text" id="questionText"></div>
          <div class="options" id="optionsContainer"></div>
          <div class="feedback" id="feedback"></div>
          <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي ◀</button>
          <button class="end-btn" onclick="confirmEndQuiz()">🏁 إنهاء الاختبار</button>
        </div>

        <!-- Result Screen -->
        <div class="result-screen" id="resultScreen">
          <div class="result-icon" id="resultIcon"></div>
          <div class="result-title" id="resultTitle"></div>
          <div class="result-score" id="resultScore"></div>
          <div class="result-details" id="resultDetails"></div>
          <div class="result-actions">
            <button class="restart-btn" onclick="restartCurrentPack()">إعادة هذه الحزمة 🔄</button>
            <button class="back-packs-btn" onclick="goBackToPacks()">← العودة للحزم</button>
          </div>
          <div class="review-section" id="reviewSection" style="display:none">
            <div class="review-header" onclick="toggleReview()">
              <span id="reviewToggleLabel">📋 عرض مراجعة الأخطاء</span>
              <span class="review-chevron" id="reviewChevron">▼</span>
            </div>
            <div class="review-list" id="reviewList"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- ══════════════ COURSE SECTION ══════════════ -->
    <div class="section-wrap" id="sectionCourse" style="display:none">
      <div class="container container--wide">

        <div class="course-header">
          <div class="big-icon">📖</div>
          <h1>الدروس والمراجعة</h1>
          <p class="subtitle">جميع الأسئلة مع إجاباتها الصحيحة مرتبة حسب المحور</p>
        </div>

        <!-- Search bar -->
        <div class="course-search-wrap">
          <input
            type="text"
            class="course-search"
            id="courseSearch"
            placeholder="🔍 ابحث في الدروس..."
            oninput="filterCourse(this.value)"
          />
        </div>

        <!-- Category filter chips -->
        <div class="course-chips" id="courseChips"></div>

        <!-- Cards -->
        <div class="course-content" id="courseContent"></div>

      </div>
    </div>

    <!-- ══════════════ END QUIZ MODAL ══════════════ -->
    <div class="modal-overlay" id="endQuizModal">
      <div class="modal-box">
        <div class="modal-icon">🏁</div>
        <h2 class="modal-title">إنهاء الاختبار؟</h2>
        <p class="modal-msg">
          الأسئلة غير المُجاب عنها ستُحتسب كإجابات
          <strong>خاطئة</strong> وستظهر نتيجتك الآن.
        </p>
        <div class="modal-stats" id="modalStats"></div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-confirm" onclick="endQuizConfirmed()">نعم، إنهاء الاختبار</button>
          <button class="modal-btn modal-btn-cancel" onclick="closeEndQuizModal()">لا، متابعة الاختبار</button>
        </div>
      </div>
    </div>

    <script src="js/questions.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/course.js"></script>
    <script>
      // ── Service Worker Registration ──────────────────────────
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }

      // ── PWA Install Prompt ───────────────────────────────────
      let deferredPrompt = null;
      const installBtn   = document.getElementById('installBtn');

      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'flex';
      });

      function installApp() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          installBtn.style.display = 'none';
        });
      }

      // Hide button once installed
      window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
        deferredPrompt = null;
      });

      // Handle shortcut URL params (?tab=quiz|course)
      const urlTab = new URLSearchParams(location.search).get('tab');
      if (urlTab === 'course') showSection('course');
    </script>
  </body>
</html>
