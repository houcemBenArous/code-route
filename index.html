<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبار رخصة السياقة صنف ب</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">

      <!-- ══════════════ PACK SELECTION SCREEN ══════════════ -->
      <div id="packScreen">
        <div class="app-header">
          <div class="big-icon">🚗</div>
          <h1>اختبار رخصة السياقة</h1>
          <p class="subtitle">صنف "ب" — تونس &nbsp;|&nbsp; اختر حزمة للبدء</p>
        </div>
        <div class="packs-grid" id="packsGrid">
          <!-- Cards injected by js/quiz.js -->
        </div>
      </div>

      <!-- ══════════════ QUIZ SCREEN ══════════════ -->
      <div id="quizScreen" style="display:none">
        <div class="quiz-header">
          <button class="back-btn" onclick="goBackToPacks()" title="العودة للحزم">&#8594; الحزم</button>
          <span class="pack-label" id="packLabel"></span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="stats">
          <span>السؤال <span id="currentQ">1</span> / <span id="totalQ"></span></span>
          <span>✅ <span id="correctCount">0</span> صحيح &nbsp;❌ <span id="wrongCount">0</span> خطأ</span>
        </div>
        <div class="timer-wrap">
          <div class="timer-circle" id="timerCircle">30</div>
          <span class="timer-label">ثانية متبقية</span>
        </div>
        <div class="question-num" id="categoryBadge"></div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي ◀</button>
        <button class="end-btn" onclick="confirmEndQuiz()">🏁 إنهاء الاختبار</button>
      </div>

      <!-- ══════════════ RESULT SCREEN ══════════════ -->
      <div class="result-screen" id="resultScreen">
        <div class="result-icon" id="resultIcon"></div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-score" id="resultScore"></div>
        <div class="result-details" id="resultDetails"></div>
        <div class="result-actions">
          <button class="restart-btn" onclick="restartCurrentPack()">إعادة هذه الحزمة 🔄</button>
          <button class="back-packs-btn" onclick="goBackToPacks()">← العودة للحزم</button>
        </div>

        <!-- Mistakes review section -->
        <div class="review-section" id="reviewSection" style="display:none">
          <div class="review-header" onclick="toggleReview()">
            <span id="reviewToggleLabel">📋 عرض مراجعة الأخطاء</span>
            <span class="review-chevron" id="reviewChevron">▼</span>
          </div>
          <div class="review-list" id="reviewList"></div>
        </div>
      </div>

    </div>

    <!-- ══════════════ END QUIZ MODAL ══════════════ -->
    <div class="modal-overlay" id="endQuizModal">
      <div class="modal-box">
        <div class="modal-icon">🏁</div>
        <h2 class="modal-title">إنهاء الاختبار؟</h2>
        <p class="modal-msg">
          الأسئلة غير المُجاب عنها ستُحتسب كإجابات
          <strong>خاطئة</strong> وستظهر نتيجتك الآن.
        </p>
        <div class="modal-stats" id="modalStats"></div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-confirm" onclick="endQuizConfirmed()">
            نعم، إنهاء الاختبار
          </button>
          <button class="modal-btn modal-btn-cancel" onclick="closeEndQuizModal()">
            لا، متابعة الاختبار
          </button>
        </div>
      </div>
    </div>

    <script src="js/questions.js"></script>
    <script src="js/quiz.js"></script>
  </body>
</html>
