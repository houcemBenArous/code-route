<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبار رخصة السياقة صنف ب</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: #fff;
        border-radius: 16px;
        padding: 36px 32px;
        max-width: 680px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      h1 {
        text-align: center;
        color: #1a1a2e;
        font-size: 1.6rem;
        margin-bottom: 8px;
      }
      .subtitle {
        text-align: center;
        color: #666;
        font-size: 0.95rem;
        margin-bottom: 28px;
      }
      .progress-bar-wrap {
        background: #e0e0e0;
        border-radius: 8px;
        height: 10px;
        margin-bottom: 10px;
      }
      .progress-bar {
        background: linear-gradient(90deg, #0f3460, #e94560);
        height: 10px;
        border-radius: 8px;
        transition: width 0.4s ease;
      }
      .stats {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        color: #555;
        margin-bottom: 22px;
      }
      .timer-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        gap: 12px;
      }
      .timer-circle {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: bold;
        color: #0f3460;
        border: 4px solid #0f3460;
        transition:
          border-color 0.3s,
          color 0.3s;
      }
      .timer-circle.warning {
        border-color: #e94560;
        color: #e94560;
      }
      .question-num {
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 8px;
      }
      .question-text {
        font-size: 1.15rem;
        color: #1a1a2e;
        font-weight: 600;
        line-height: 1.7;
        margin-bottom: 24px;
        background: #f8f9ff;
        padding: 16px;
        border-radius: 10px;
        border-right: 4px solid #0f3460;
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .option-btn {
        background: #f5f5f5;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 14px 18px;
        font-size: 1rem;
        color: #333;
        cursor: pointer;
        text-align: right;
        transition: all 0.2s;
        font-family: inherit;
      }
      .option-btn:hover:not(:disabled) {
        background: #e8ecff;
        border-color: #0f3460;
        color: #0f3460;
      }
      .option-btn.correct {
        background: #d4edda;
        border-color: #28a745;
        color: #155724;
      }
      .option-btn.wrong {
        background: #f8d7da;
        border-color: #dc3545;
        color: #721c24;
      }
      .option-btn.reveal {
        background: #d4edda;
        border-color: #28a745;
        color: #155724;
      }
      .option-btn:disabled {
        cursor: default;
      }
      .feedback {
        margin-top: 18px;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        display: none;
      }
      .feedback.show {
        display: block;
      }
      .feedback.correct-fb {
        background: #d4edda;
        color: #155724;
      }
      .feedback.wrong-fb {
        background: #f8d7da;
        color: #721c24;
      }
      .feedback.timeout-fb {
        background: #fff3cd;
        color: #856404;
      }
      .next-btn {
        display: none;
        margin-top: 20px;
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #0f3460, #e94560);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        font-family: inherit;
        transition: opacity 0.2s;
      }
      .next-btn:hover {
        opacity: 0.9;
      }
      .next-btn.show {
        display: block;
      }
      .end-btn {
        display: block;
        margin-top: 10px;
        width: 100%;
        padding: 11px;
        background: transparent;
        color: #e94560;
        border: 2px solid #e94560;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: bold;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
      }
      .end-btn:hover { background: #e94560; color: #fff; }
      /* Result screen */
      .result-screen {
        display: none;
        text-align: center;
      }
      .result-screen.show {
        display: block;
      }
      .result-icon {
        font-size: 5rem;
        margin-bottom: 16px;
      }
      .result-title {
        font-size: 1.8rem;
        font-weight: bold;
        margin-bottom: 12px;
      }
      .result-title.success {
        color: #28a745;
      }
      .result-title.fail {
        color: #dc3545;
      }
      .result-score {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 24px;
      }
      .result-details {
        background: #f8f9ff;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 24px;
        text-align: right;
      }
      .result-details p {
        margin-bottom: 6px;
        color: #333;
        font-size: 0.95rem;
      }
      .restart-btn {
        padding: 14px 40px;
        background: linear-gradient(135deg, #0f3460, #e94560);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        font-family: inherit;
      }
      .restart-btn:hover {
        opacity: 0.9;
      }
      /* Start screen */
      .start-screen {
        text-align: center;
      }
      .start-screen .big-icon {
        font-size: 4rem;
        margin-bottom: 16px;
      }
      .start-screen p {
        color: #555;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }
      .start-btn {
        margin-top: 24px;
        padding: 14px 48px;
        background: linear-gradient(135deg, #0f3460, #e94560);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        font-family: inherit;
      }
      .start-btn:hover {
        opacity: 0.9;
      }
      .category-badge {
        display: inline-block;
        background: #e8ecff;
        color: #0f3460;
        border-radius: 6px;
        padding: 2px 10px;
        font-size: 0.8rem;
        margin-bottom: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Start Screen -->
      <div class="start-screen" id="startScreen">
        <div class="big-icon">🚗</div>
        <h1>اختبار رخصة السياقة</h1>
        <p class="subtitle" style="margin-top: 8px">صنف "ب" - تونس</p>
        <br />
        <p>📋 عدد الأسئلة الكلية: <strong id="totalQCount"></strong></p>
        <p>⏱️ وقت كل سؤال: <strong>30 ثانية</strong></p>
        <p>✅ نسبة النجاح المطلوبة: <strong>80%</strong></p>
        <p>🔀 الأسئلة تظهر بشكل عشوائي في كل مرة</p>
        <button class="start-btn" onclick="startQuiz()">ابدأ الاختبار</button>
      </div>

      <!-- Quiz Screen -->
      <div id="quizScreen" style="display: none">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="stats">
          <span
            >السؤال <span id="currentQ">1</span> / <span id="totalQ"></span
          ></span>
          <span
            >✅ <span id="correctCount">0</span> صحيح &nbsp; ❌
            <span id="wrongCount">0</span> خطأ</span
          >
        </div>
        <div class="timer-wrap">
          <div class="timer-circle" id="timerCircle">30</div>
          <span style="color: #555; font-size: 0.9rem">ثانية متبقية</span>
        </div>
        <div class="question-num" id="categoryBadge"></div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
          السؤال التالي ◀
        </button>
        <button class="end-btn" id="endBtn" onclick="confirmEndQuiz()">
          🏁 إنهاء الاختبار
        </button>
      </div>

      <!-- Result Screen -->
      <div class="result-screen" id="resultScreen">
        <div class="result-icon" id="resultIcon"></div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-score" id="resultScore"></div>
        <div class="result-details" id="resultDetails"></div>
        <button class="restart-btn" onclick="restartQuiz()">
          إعادة الاختبار 🔄
        </button>
      </div>
    </div>
  </body>
</html>

<script>
const allQuestions = [
  // === رخصة صنف ب ===
  { cat: "رخصة صنف ب", q: "ما هو الحد الأقصى لعدد مقاعد السيارة المسموح بقيادتها برخصة صنف 'ب' (بدون اعتبار مقعد السائق)؟", opts: ["8 مقاعد", "5 مقاعد", "12 مقعداً"], ans: 0 },
  { cat: "رخصة صنف ب", q: "كم يُسمح للسائق الذي عمره أقل من 20 سنة بنقل من الأشخاص (بدون اعتبار مقعد السائق)؟", opts: ["5 أشخاص", "8 أشخاص", "3 أشخاص"], ans: 0 },
  { cat: "رخصة صنف ب", q: "ما هو الوزن الجملي المرخص فيه للسيارة التي تسمح بها رخصة صنف 'ب'؟", opts: ["3500 كغ", "2500 كغ", "5000 كغ"], ans: 0 },
  { cat: "رخصة صنف ب", q: "ما هو الوزن الجملي المرخص فيه للمجرورة التي يمكن قرنها بالسيارة في الحالة العادية؟", opts: ["750 كغ أو أقل", "500 كغ أو أقل", "1000 كغ أو أقل"], ans: 0 },

  { cat: "رخصة صنف ب", q: "رخصة السياقة صنف 'ب' تمكن من قيادة أي أصناف أخرى؟", opts: ["صنف أ1 وصنف ح", "صنف أ وصنف د", "صنف ب1 فقط"], ans: 0 },
  { cat: "رخصة صنف ب", q: "ما هي السرعة القصوى للسائق المتربص خارج مناطق العمران وفي الطريق السيارة؟", opts: ["80 كلم/س", "90 كلم/س", "110 كلم/س"], ans: 0 },
  { cat: "رخصة صنف ب", q: "ما هي أوراق السائق الواجب توفرها عند القيادة؟", opts: ["بطاقة تعريف وطنية أو جواز سفر ورخصة السياقة", "رخصة السياقة فقط", "بطاقة تعريف وطنية وشهادة الفحص الفني"], ans: 0 },
  { cat: "رخصة صنف ب", q: "ما هي الوثيقة التي تثبت تسجيل المجرورة عندما يتجاوز وزنها 500 كغ؟", opts: ["بطاقة رمادية وشهادة تسجيل", "شهادة التأمين فقط", "شهادة الفحص الفني فقط"], ans: 0 },
  { cat: "رخصة صنف ب", q: "متى يجب تقديم شهادة طبية للسائق؟", opts: ["عند الحصول على الرخصة لأول مرة أو عند تجديدها", "كل سنة بصفة دورية", "عند كل فحص فني للسيارة"], ans: 0 },
  { cat: "رخصة صنف ب", q: "ما هو الحد الأدنى لسن الأطفال المسموح لهم بالجلوس في المقاعد الأمامية؟", opts: ["10 سنوات", "12 سنة", "8 سنوات"], ans: 0 },

  // === الفحص الفني ===

  { cat: "الفحص الفني", q: "ماذا يحدث إذا لم تُصلح عيوب العربة خلال 15 يوماً بعد الفحص العرضي؟", opts: ["تُعرض على الفحص الفني الدوري", "تُسحب رخصة السيارة نهائياً", "يُمنع السائق من القيادة 3 أشهر"], ans: 0 },

  // === السرعة ===

// =========== QUIZ ENGINE ===========
let questions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let timer = null;
let timeLeft = 30;
let answered = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  questions = shuffle([...allQuestions]);
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('totalQ').textContent = questions.length;
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  timeLeft = 30;
  clearInterval(timer);

  const q = questions[currentIndex];
  const total = questions.length;

  document.getElementById('currentQ').textContent = currentIndex + 1;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('progressBar').style.width = ((currentIndex / total) * 100) + '%';
  document.getElementById('categoryBadge').innerHTML = `<span class="category-badge">${q.cat}</span>`;
  document.getElementById('questionText').textContent = q.q;

  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback';
  feedback.textContent = '';

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.className = 'next-btn';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  // Shuffle options with correct answer tracking
  const optIndexes = [0, 1, 2];
  const shuffled = shuffle([...optIndexes]);
  const correctOriginal = q.ans; // always 0

  shuffled.forEach((origIdx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = q.opts[origIdx];
    btn.onclick = () => selectAnswer(btn, origIdx === correctOriginal);
    container.appendChild(btn);
  });

  // Timer
  updateTimerDisplay();
  timer = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timer);
      onTimeout();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const circle = document.getElementById('timerCircle');
  circle.textContent = timeLeft;
  if (timeLeft <= 10) {
    circle.classList.add('warning');
  } else {
    circle.classList.remove('warning');
  }
}

function selectAnswer(btn, isCorrect) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  const feedback = document.getElementById('feedback');

  if (isCorrect) {
    btn.classList.add('correct');
    correctCount++;
    feedback.textContent = '✅ إجابة صحيحة!';
    feedback.className = 'feedback show correct-fb';
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    // Highlight correct answer
    const q = questions[currentIndex];
    allBtns.forEach(b => {
      if (b.textContent === q.opts[q.ans]) b.classList.add('reveal');
    });
    feedback.textContent = '❌ إجابة خاطئة! الإجابة الصحيحة مُعلَّمة باللون الأخضر.';
    feedback.className = 'feedback show wrong-fb';
  }

  document.getElementById('nextBtn').className = 'next-btn show';
}

function onTimeout() {
  if (answered) return;
  answered = true;
  wrongCount++;

  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  const q = questions[currentIndex];
  allBtns.forEach(b => {
    if (b.textContent === q.opts[q.ans]) b.classList.add('reveal');
  });

  const feedback = document.getElementById('feedback');
  feedback.textContent = '⏰ انتهى الوقت! الإجابة الصحيحة مُعلَّمة باللون الأخضر.';
  feedback.className = 'feedback show timeout-fb';

  document.getElementById('nextBtn').className = 'next-btn show';
}

function confirmEndQuiz() {
  if (confirm('هل أنت متأكد أنك تريد إنهاء الاختبار؟ ستُحتسب الأسئلة غير المُجاب عنها كإجابات خاطئة.')) {
    clearInterval(timer);
    // Count remaining unanswered questions as wrong
    const remaining = questions.length - currentIndex - (answered ? 1 : 0);
    wrongCount += remaining;
    showResult();
  }
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResult();
  } else {
    loadQuestion();
  }
}

function showResult() {
  clearInterval(timer);
  document.getElementById('quizScreen').style.display = 'none';
  const resultScreen = document.getElementById('resultScreen');
  resultScreen.classList.add('show');

  const total = questions.length;
  const pct = Math.round((correctCount / total) * 100);
  const passed = pct >= 80;

  document.getElementById('resultIcon').textContent = passed ? '🏆' : '😞';
  document.getElementById('resultTitle').textContent = passed ? 'مبروك! لقد نجحت!' : 'للأسف لم تنجح';
  document.getElementById('resultTitle').className = 'result-title ' + (passed ? 'success' : 'fail');
  document.getElementById('resultScore').textContent = `نسبتك: ${pct}% ${passed ? '— تجاوزت عتبة 80%' : '— لم تبلغ عتبة 80% المطلوبة'}`;

  document.getElementById('resultDetails').innerHTML = `
    <p>✅ إجابات صحيحة: <strong>${correctCount}</strong></p>
    <p>❌ إجابات خاطئة: <strong>${wrongCount}</strong></p>
    <p>📋 مجموع الأسئلة: <strong>${total}</strong></p>
    <p>🎯 النسبة المئوية: <strong>${pct}%</strong></p>
    ${!passed ? '<p style="color:#dc3545; margin-top:10px;">⚠️ يجب إعادة الاختبار لتحسين نتيجتك.</p>' : ''}
  `;
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('quizScreen').style.display = 'none';
}

// Set total question count on start screen
document.getElementById('totalQCount').textContent = allQuestions.length;
</script>
</body>
</html>
