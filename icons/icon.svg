<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Road surface -->
  <rect x="176" y="220" width="160" height="220" rx="8" fill="url(#road)"/>

  <!-- Road center dashes -->
  <rect x="248" y="240" width="16" height="32" rx="4" fill="#f8fafc" opacity="0.7"/>
  <rect x="248" y="292" width="16" height="32" rx="4" fill="#f8fafc" opacity="0.7"/>
  <rect x="248" y="344" width="16" height="32" rx="4" fill="#f8fafc" opacity="0.7"/>
  <rect x="248" y="396" width="16" height="20" rx="4" fill="#f8fafc" opacity="0.7"/>

  <!-- Car body -->
  <rect x="192" y="285" width="128" height="64" rx="10" fill="#e11d48"/>

  <!-- Car roof -->
  <path d="M220 285 L228 248 L284 248 L292 285 Z" fill="#be123c" rx="6"/>

  <!-- Car windows -->
  <rect x="232" y="254" width="22" height="24" rx="4" fill="#bfdbfe" opacity="0.9"/>
  <rect x="258" y="254" width="22" height="24" rx="4" fill="#bfdbfe" opacity="0.9"/>

  <!-- Wheels -->
  <circle cx="218" cy="352" r="20" fill="#1e293b"/>
  <circle cx="218" cy="352" r="10" fill="#94a3b8"/>
  <circle cx="294" cy="352" r="20" fill="#1e293b"/>
  <circle cx="294" cy="352" r="10" fill="#94a3b8"/>

  <!-- Headlights -->
  <rect x="192" y="300" width="14" height="10" rx="3" fill="#fef08a"/>
  <rect x="306" y="300" width="14" height="10" rx="3" fill="#fef08a"/>

  <!-- Stars / speed lines above car -->
  <circle cx="168" cy="200" r="6" fill="#fbbf24" opacity="0.8"/>
  <circle cx="344" cy="180" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="148" cy="270" r="4" fill="#93c5fd" opacity="0.7"/>
  <circle cx="366" cy="260" r="4" fill="#93c5fd" opacity="0.7"/>

  <!-- Text: CODE ROUTE -->
  <text x="256" y="474" font-family="Arial, sans-serif" font-size="36" font-weight="800"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">CODE ROUTE</text>
</svg>
